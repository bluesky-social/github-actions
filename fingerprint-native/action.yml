---
name: Fingerprint Native Changes
author: bluesky-social
description: Debug the fingerprint of two separate commits for OTA-breaking changes
runs:
  using: node24
  main: ../build/fingerprint-native/index.js
inputs:
  profile:
    description: The profile that we are perform. Options are `production`, `testflight`, or `pull-request`
    required: true
  previous-commit-tag:
    description: Tag for getting the second commit to debug against.
    required: false
  baseline-fingerprint-path:
    description: >-
      For the `testflight` profile: path to the full Expo fingerprint from the
      most recent successful native deploy. When provided, the action compares
      the current fingerprint against it directly and skips checking out and
      reinstalling the baseline commit. When omitted, the action forces a native
      build so its successful completion can seed the baseline safely. Ignored
      for the `production` and `pull-request` profiles.
    required: false
outputs:
  includes-changes:
    description: Whether there are changes that prevent the commit from being properly deployed with the current client.
  diff:
    description: The diff between the two fingerprints.
  diff-path:
    description: >-
      Path to the full fingerprint diff as JSON. Upload this file as an
      artifact instead of embedding the unbounded diff output in PR comments.
  diff-summary:
    description: A bounded, human-readable summary of the fingerprint diff.
  current-fingerprint-path:
    description: >-
      Path to the current commit's full Expo fingerprint. Persist this as the
      baseline for the next testflight run after a successful deploy.
